<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OS Lab · Interactive Shell Script Mastery & Playground</title>
<style>
:root {
  --bg: #f8fafc;
  --fg: #0f172a;
  --mut: #64748b;
  --card: #ffffff;
  --card-subtle: #f1f5f9;
  --bd: #e2e8f0;
  --bd-focus: #0ea5e9;
  --ac: #0d9488;
  --ac-hover: #0f766e;
  --ac-subtle: #f0fdfa;
  --accent-text: #ffffff;
  --code-bg: #0b1017;
  --code-fg: #f1f5f9;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --info: #0284c7;
  --tag-bg: #e0f2fe;
  --tag-fg: #0369a1;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.05);
  --radius: 12px;
  box-sizing: border-box;
}

[data-theme="dark"] {
  --bg: #090d12;
  --fg: #f1f5f9;
  --mut: #94a3b8;
  --card: #111720;
  --card-subtle: #171f2c;
  --bd: #222d3d;
  --bd-focus: #38bdf8;
  --ac: #2dd4bf;
  --ac-hover: #14b8a6;
  --ac-subtle: #134e4a33;
  --accent-text: #042f2e;
  --code-bg: #080c10;
  --code-fg: #f1f5f9;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #38bdf8;
  --tag-bg: #0c4a6e;
  --tag-fg: #7dd3fc;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 20px -3px rgba(0,0,0,0.5);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d12;
    --fg: #f1f5f9;
    --mut: #94a3b8;
    --card: #111720;
    --card-subtle: #171f2c;
    --bd: #222d3d;
    --bd-focus: #38bdf8;
    --ac: #2dd4bf;
    --ac-hover: #14b8a6;
    --ac-subtle: #134e4a33;
    --accent-text: #042f2e;
    --code-bg: #080c10;
    --code-fg: #f1f5f9;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #38bdf8;
    --tag-bg: #0c4a6e;
    --tag-fg: #7dd3fc;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    --shadow-lg: 0 10px 20px -3px rgba(0,0,0,0.5);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  transition: background .2s ease, color .2s ease;
}

header {
  border-bottom: 1px solid var(--bd);
  background: var(--card);
  padding: 12px 24px;
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--shadow);
}
.brand-area { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--ac), #0284c7);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 19px;
  box-shadow: 0 2px 8px rgba(13,148,136,0.3);
}
.brand-title { margin: 0; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.brand-subtitle { font-size: 12px; color: var(--mut); margin: 0; }

.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.progress-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card-subtle);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 13px;
  color: var(--fg);
}
.prog-bar-bg { width: 70px; height: 7px; background: var(--bd); border-radius: 4px; overflow: hidden; }
.prog-bar-fill { height: 100%; background: var(--success); width: 0%; transition: width .3s ease; }

button {
  background: var(--ac);
  color: var(--accent-text);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 7px 14px;
  font: inherit;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s ease;
}
button:hover { opacity: 0.92; transform: translateY(-1px); }
button:active { transform: translateY(0); }
button.btn-sec { background: var(--card-subtle); color: var(--fg); border-color: var(--bd); }
button.btn-sec:hover { background: var(--bd); }
button.btn-subtle { background: transparent; color: var(--mut); border-color: transparent; padding: 4px 8px; }
button.btn-subtle:hover { color: var(--fg); background: var(--card-subtle); }

.w {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 20px;
  padding: 20px 24px 60px;
  max-width: 1400px;
  margin: auto;
}

nav {
  border: 1px solid var(--bd);
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px;
  position: sticky;
  top: 72px;
  max-height: calc(100vh - 90px);
  overflow-y: auto;
  box-shadow: var(--shadow);
}
.search-wrapper { position: relative; margin-bottom: 10px; }
.search-input {
  width: 100%;
  padding: 8px 30px 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: var(--bg);
  color: var(--fg);
  font: inherit;
  font-size: 13.5px;
  outline: none;
  transition: border .15s ease;
}
.search-input:focus { border-color: var(--bd-focus); }
.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--mut);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
}

.filter-pills { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
.pill {
  padding: 3px 9px;
  font-size: 12px;
  border-radius: 12px;
  background: var(--card-subtle);
  border: 1px solid var(--bd);
  color: var(--mut);
  cursor: pointer;
  white-space: nowrap;
}
.pill.active { background: var(--ac); color: var(--accent-text); border-color: var(--ac); font-weight: 600; }

nav h4 {
  margin: 12px 6px 4px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--mut);
}
nav a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-radius: 8px;
  color: var(--fg);
  text-decoration: none;
  font-size: 13.5px;
  margin-bottom: 2px;
  transition: background .12s ease;
}
nav a:hover { background: var(--card-subtle); }
nav a.on { background: var(--ac); color: var(--accent-text); font-weight: 600; }
.q-badge {
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--bd);
  color: var(--fg);
  font-weight: 600;
  margin-right: 6px;
}
nav a.on .q-badge { background: rgba(255,255,255,0.25); color: #fff; }
.nav-status { font-size: 12px; }

main { min-width: 0; }
.card {
  border: 1px solid var(--bd);
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.q-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.q-title-group h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
.q-tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--tag-bg);
  color: var(--tag-fg);
}
.master-btn {

  align-items: center;
  gap: 6px;

/* Tabs */
.tab-bar {

  gap: 6px;
  border-bottom: 1px solid var(--bd);
  margin-bottom: 16px;
  overflow-x: auto;
}
.tab-btn {

  color: var(--mut);
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--fg); background: transparent; transform: none; }
.tab-btn.active { color: var(--ac); border-bottom-color: var(--ac); font-weight: 600; }

.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Code Area & Syntax Highlighting */
.code-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #141b24;
  color: #94a3b8;
  padding: 8px 14px;
  border-top-left-radius: 10px;
  border-top-right-radius: 10px;
  font-size: 13px;
  border: 1px solid #1e293b;
  border-bottom: none;
}
.code-actions { display: flex; gap: 6px; }
pre.code-block {
  background: var(--code-bg);
  color: var(--code-fg);
  border: 1px solid #1e293b;
  border-bottom-left-radius: 10px;
  border-bottom-right-radius: 10px;
  padding: 14px 0;
  margin: 0 0 12px;
  overflow-x: auto;
  font: 13.5px/1.65 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  counter-reset: l;
}
.ln {
  display: block;
  padding: 0 16px 0 8px;
  white-space: pre;
  counter-increment: l;
  border-left: 3px solid transparent;
}
.ln:before {
  content: counter(l);
  display: inline-block;
  width: 28px;
  color: #475569;
  margin-right: 12px;
  text-align: right;
  user-select: none;
}
.ln.on { background: rgba(250, 204, 21, 0.15); border-left-color: #facc15; }

/* Syntax tokens */
.sh-kw { color: #c084fc; font-weight: 600; }
.sh-builtin { color: #38bdf8; font-weight: 600; }
.sh-var { color: #67e8f9; }
.sh-str { color: #86efac; }
.sh-num { color: #fca5a5; }
.sh-op { color: #f472b6; }
.sh-com { color: #64748b; font-style: italic; }
.sh-punc { color: #94a3b8; }

.say {
  min-height: 48px;
  margin: 10px 0;
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--card-subtle);
  border: 1px solid var(--bd);
  font-size: 14px;
}

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin: 10px 0; }
td, th { border: 1px solid var(--bd); padding: 7px 10px; text-align: center; font-size: 13.5px; }
th { background: var(--card-subtle); font-weight: 600; }

input[type=number], input[type=text] {
  padding: 6px 10px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--bd);
  border-radius: 6px;
  font: inherit;
  font-size: 13.5px;
}
input[type=number]:focus, input[type=text]:focus { border-color: var(--bd-focus); outline: none; }

/* Gantt Chart */
.g {
  display: flex;
  position: relative;
  margin: 22px 0 32px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  overflow: visible;
}
.s {
  position: relative;
  min-width: 0;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 13.5px;
  font-weight: 700;
  border-right: 1px solid rgba(255,255,255,0.2);
  transform-origin: left;
  animation: pop .45s both;
}
.s i {
  position: absolute;
  bottom: -22px;
  left: 0;
  font: 12px ui-monospace, monospace;
  color: var(--mut);
  font-style: normal;
  font-weight: normal;
}
.g em {
  position: absolute;
  right: 0;
  bottom: -22px;
  font: 12px ui-monospace, monospace;
  color: var(--mut);
  font-style: normal;
  font-weight: 600;
}
@keyframes pop { from { transform: scaleX(0); opacity: 0; } }

/* Explain mode token hover */
.tk { border-bottom: 1px dotted var(--mut); cursor: help; }
.tk:hover { background: rgba(250, 204, 21, 0.25); border-radius: 2px; }
#tip {

  z-index: 99;

  background: #0d1117;
  color: #e6edf3;

  border-radius: 10px;

}

textarea.pc {

.pr {

</style>

<!-- Data Scripts -->
<script type="text/plain" id="d">
@@ Basics | 1. Prime or not
read -p "Number: " n; p=1 #@ Read n. p=1 means "assume prime until proven otherwise".
((n<2)) && p=0 #@ 0 and 1 are not prime.
for ((i=2;i*i<=n;i++)); do ((n%i==0)) && p=0; done #@ Try divisors 2 up to the square root of n. If any divides n with remainder 0, n is not prime.
((p)) && echo Prime || echo "Not prime" #@ p is still 1, so Prime. Otherwise Not prime.
@@ Basics | 2. Palindrome or not
read -p "Word or number: " s #@ Read the text into s.
[ "$s" = "$(rev <<< "$s")" ] && echo Palindrome || echo "Not palindrome" #@ rev reverses the text. If the reversed text equals the original (racecar, 121) it is a palindrome.
@@ Basics | 3. Largest and smallest number
read -p "Numbers: " -a a #@ -a stores all typed numbers in the array a.
s=($(printf "%s\n" "${a[@]}" | sort -n)) #@ Print one number per line, sort numerically, store back in array s (smallest first).
echo "Smallest: ${s[0]}  Largest: ${s[-1]}" #@ First element is the smallest, last element (index -1) is the largest.
@@ Basics | 4. Search a string in a file
read -p "String: " s; read -p "File: " f #@ Ask for the search string and the file name.

n one line per process: arrival time and burst time."}, "13": {"c": "bash q13.sh", "i": "4\n0 5 2\n1 3 1\n2 8 3\n3 6 2", "o": "P2 finish=4 TAT=3 WT=0\nP1 finish=8 TAT=8 WT=3\nP4 finish=14 TAT=11 WT=5\nP3 finish=22 TAT=20 WT=12\nAverage TAT=10.50  Average WT=5.00", "n": "First line: number of processes. Then one line per process: arrival, burst, priority (smaller number = higher priority)."}, "14": {"c": "bash q14.sh", "i": "4\n0 5 2\n1 3 1\n2 8 3\n3 6 2", "o": "P1 finish=5 TAT=5 WT=0\nP2 finish=8 TAT=7 WT=4\nP4 finish=14 TAT=11 WT=5\nP3 finish=22 TAT=20 WT=12\nAverage TAT=10.75  Average WT=5.25", "n": "First line: number of processes. Then one line per process: arrival, burst, priority (smaller number = higher priority)."}, "15": {"c": "bash q15.sh", "i": "4 2 1\n0 5\n1 3\n2 8\n3 6", "o": "P2 finish=16 TAT=15 WT=12\nP1 finish=21 TAT=21 WT=16\nP4 finish=30 TAT=27 WT=21\nP3 finish=33 TAT=31 WT=23\nAverage TAT=23.50  Average WT=18.00", "n": "First line: processes, time quantum, context-switch time. Then arrival and burst of each process."}, "16": {"c": "bash q16.sh", "i": "4 2\n0 5\n1 3\n2 8\n3 6", "o": "P2 finish=11 TAT=10 WT=7\nP1 finish=14 TAT=14 WT=9\nP4 finish=20 TAT=17 WT=11\nP3 finish=22 TAT=20 WT=12\nAverage TAT=15.25  Average WT=9.75", "n": "First line: processes and time quantum. Then arrival and burst of each process."}, "17": {"c": "bash q17.sh", "i": "3\n4\n0 5 2\n1 3 1\n2 8 3\n3 6 2", "o": "1 FCFS 2 SJF 3 SRTN 4 PRIORITY-P 5 PRIORITY-NP 6 RR\nP2 finish=4 TAT=3 WT=0\nP1 finish=8 TAT=8 WT=3\nP4 finish=14 TAT=11 WT=5\nP3 finish=22 TAT=20 WT=12\nAverage TAT=10.50  Average WT=5.00", "n": "3 chooses SRTN. Then: number of processes, then arrival, burst, priority for each."}, "18": {"c": "bash q18.sh", "i": "4\n2 5\n1 3\n2 8\n1 6", "o": "Queue 1: P2 finish=3 TAT=3 WT=0\nQueue 1: P4 finish=9 TAT=9 WT=3\nQueue 2: P1 finish=14 TAT=14 WT=9\nQueue 2: P3 finish=22 TAT=22 WT=14", "n": "Each line: queue number (1 = system, 2 = user) and burst time. All arrive at time 0."}, "19": {"c": "bash q19.sh", "i": "5 3\n0 1 0\n2 0 0\n3 0 2\n2 1 1\n0 0 2\n7 5 3\n3 2 2\n9 0 2\n2 2 2\n4 3 3\n3 3 2", "o": "Allocation\nMax\nSAFE: P1 P3 P4 P0 P2 ", "n": "First line: 5 processes, 3 resource types. Then the Allocation rows, the Max rows and the Available vector."}, "20": {"c": "bash q20.sh", "i": "5 3\n0 1 0\n2 0 0\n3 0 3\n2 1 1\n0 0 2\n0 0 0\n2 0 2\n0 0 1\n1 0 0\n0 0 2\n0 0 0", "o": "Allocation\nRequest\nDeadlocked: P1 P2 P3 P4 ", "n": "First line: 5 processes, 3 resource types. Then the Allocation rows, the Request rows and the Available vector. P0 can finish and nothing else can, so P1 to P4 are deadlocked."}, "21": {"c": "bash q21.sh", "i": "", "o": "P0 IN critical section\nP0 OUT of critical section\nP1 IN critical section\nP1 OUT of critical section", "n": "No input needed. The order of P0 and P1 may differ between runs, but they never overlap."}, "22": {"c": "bash q22.sh", "i": "", "o": "Philosopher 4 eating (forks 0,4)\nPhilosopher 4 done\nPhilosopher 3 eating (forks 3,4)\nPhilosopher 3 done\nPhilosopher 2 eating (forks 2,3)\nPhilosopher 2 done\nPhilosopher 1 eating (forks 1,2)\nPhilosopher 1 done\nPhilosopher 0 eating (forks 0,1)\nPhilosopher 0 done", "n": "No input needed. The order may differ between runs, but neighbours never eat at the same time."}, "23": {"c": "bash q23.sh", "i": "", "o": "Produced 1\nProduced 2\nProduced 3\nConsumed 1\nProduced 4\nConsumed 2\nProduced 5\nConsumed 3\nProduced 6\nConsumed 4\nConsumed 5\nConsumed 6", "n": "No input needed. The producer runs ahead by at most 3 items, because the buffer has 3 slots."}}

<script type="text/plain" id="viva-data">
{"1": [{"q": "Why is the loop condition i*i <= n used instead of i <= n/2 or i < n?", "a": "Every composite number n must have at least one factor less than or equal to \u221an. If no factor divides n up to \u221an, no factor exists above it either (since any pair factor would have to be \u2264 \u221an). This reduces the time complexity from O(n) to O(\u221an)."}, {"q": "What does ((n < 2)) do in Bash arithmetic evaluation?", "a": "Double parentheses (( ... )) evaluate C-style integer expressions. In Bash, if the arithmetic expression inside is true (non-zero), the command returns exit code 0 (success). If false (zero), it returns exit code 1. Here, if n < 2, the exit code is 0, so && p=0 executes."}, {"q": "What is the meaning of the exit status of a Linux command?", "a": "Every Linux command returns an integer exit code between 0 and 255 to the parent shell. Exit code 0 denotes success, while any non-zero value (typically 1 to 255) indicates failure, an error, or a false conditional test."}], "2": [{"q": "What is the here-string operator <<< and how does it differ from a pipe?", "a": "The <<< operator is a Bash here-string that passes a string variable directly to standard input of a command (e.g. rev <<< \"$s\"). Unlike echo \"$s\" | rev, it runs in the current shell process without spawning a subshell, making it faster and cleaner."}, {"q": "What is the difference between single brackets [ ... ] and double brackets [[ ... ]] in Bash?", "a": "[ ... ] is an alias for the POSIX test utility where variable expansion requires quotes to prevent word-splitting and pathname expansion. [[ ... ]] is a modern Bash keyword with built-in regex matching (=~), no word-splitting, and direct logical operators (&&, ||)."}, {"q": "What is the time and space complexity of palindrome checking using rev?", "a": "The rev utility reads the string of length L, reverses characters in O(L) time and O(L) auxiliary memory, and the string comparison takes O(L) time. Overall time complexity is linear O(L)."}], "3": [{"q": "Why is sort -n used instead of standard sort?", "a": "Standard sort performs lexicographical (ASCII character code) sorting, where '10' appears before '2' because '1' < '2'. The -n flag enforces numerical comparison, correctly ordering negative numbers, zero, and multi-digit values (e.g. -3, 0, 5, 7, 12)."}, {"q": "How does Bash handle negative array indices like ${s[-1]}?", "a": "In Bash 4.2+, negative indexing accesses array elements from the end: ${s[-1]} references the last element. In older versions (like macOS default Bash 3.2), it can be written portably as ${s[${#s[@]}-1]}."}, {"q": "What does the -a flag in read -a do?", "a": "The -a option instructs read to split the typed input line on space/delimiter boundaries and assign the resulting words into sequential indices of an indexed array."}], "4": [{"q": "What does the -n option do in grep -n?", "a": "The -n option prefixes each matching line in the output with its 1-based line number in the source file, which helps developers locate patterns quickly."}, {"q": "How does the || operator work in grep -n \"$s\" \"$f\" || echo \"Not found\"?", "a": "|| is the logical OR operator in Bash. The right-hand side executes only if the left-hand side fails (returns a non-zero exit status). When grep finds zero matching lines, it exits with status 1, which triggers echo 'Not found'."}, {"q": "What are the standard exit codes returned by grep?", "a": "Exit code 0: At least one matching line was found. Exit code 1: No match was found. Exit code 2+: An error occurred (such as file not found or permission denied)."}], "5": [{"q": "Why is 1 subtracted when counting directories with find?", "a": "find $d -maxdepth 1 -type d lists all directories within $d, including the target directory $d itself ('.'). Subtracting 1 removes the parent folder from the count, leaving only true subdirectories."}, {"q": "What does ${1:-.} parameter expansion mean?", "a": "It provides a default parameter value: if positional argument $1 is unset or empty, it evaluates to . (the current directory); otherwise, it evaluates to the value of $1."}, {"q": "What is the difference between -type f and -executable in find?", "a": "-type f restricts results strictly to regular files (ignoring directories, symlinks, FIFOs, sockets). -executable filters those files to only those having execute permissions for the current user."}], "6": [{"q": "What are the common Unix file test operators in Bash?", "a": "-f checks for regular files; -d checks for directories; -e checks if a file/path exists; -s checks if a file is non-empty; -L checks for symbolic links; -x checks execute permissions; -b and -c check for block/character devices."}, {"q": "What falls under 'Something else' when checking with -e after -f and -d?", "a": "Any non-regular and non-directory filesystem entry, such as symbolic links, block devices (disks), character devices (/dev/null, terminal), named pipes (FIFOs), and Unix domain sockets."}, {"q": "What is an inode in Unix filesystems?", "a": "An inode (index node) is a filesystem metadata data structure that stores file type, access permissions, owner, group, file size, timestamps, and data block pointers. The filename is stored separately in directory data."}], "7": [{"q": "What does ${1%.c} do in Bash parameter expansion?", "a": "The % operator removes the shortest matching suffix from the value of $1. If $1 is 'hello.c', ${1%.c} strips '.c' to produce 'hello', allowing the executable name to match the C source basename."}, {"q": "What are the 4 fundamental stages of C compilation performed by gcc?", "a": "1. Preprocessing (cpp: expands #include, #define macros, strips comments); 2. Compilation (cc1: translates preprocessed C into assembly language); 3. Assembly (as: translates assembly into machine code object file .o); 4. Linking (ld: links object files and libraries into an ELF executable binary)."}, {"q": "Why is chmod +x used on the compiled output?", "a": "While gcc sets execute bits automatically on successful builds, explicit chmod +x ensures execute permissions are granted even under restrictive umask environments before running ./${1%.c}."}], "8": [{"q": "How does GNU sed '2~2d' work?", "a": "In GNU sed, the address format first~step matches every step-th line starting at first. '2~2d' matches lines 2, 4, 6, 8, ... and the 'd' command deletes them."}, {"q": "What does the -i flag in sed do?", "a": "The -i flag performs in-place file editing. It creates a temporary file with the changes and renames it over the original file, modifying the file directly on disk instead of writing to stdout."}, {"q": "How would you delete all odd-numbered lines instead?", "a": "Using sed -i '1~2d' \"$1\", which starts at line 1 and deletes every 2nd line (lines 1, 3, 5, 7, ...)."}], "9": [{"q": "How does awk 'seen[$1]++{print $2}' identify duplicates?", "a": "awk maintains an associative hash map 'seen'. For the first occurrence of hash $1, seen[$1] is 0 (evaluates to false), and it increments to 1 without printing. For duplicate files with the identical hash, seen[$1] is >= 1 (evaluates to true), so print $2 outputs the duplicate file name."}, {"q": "What is the purpose of xargs -r?", "a": "The -r (--no-run-if-empty) flag instructs xargs not to execute the target command (rm -v) if standard input is empty, preventing 'rm: missing operand' errors when no duplicates exist."}, {"q": "Why is MD5 checksum used instead of comparing file names or file sizes?", "a": "Duplicate files often have different names (e.g. report.pdf and report_copy.pdf). File sizes can match by coincidence between completely different files. Cryptographic checksums like MD5 generate an identical digest if and only if the byte contents are identical."}], "10": [{"q": "What is the Convoy Effect in FCFS scheduling?", "a": "The Convoy Effect occurs when a long CPU-burst process runs first, forcing multiple short, I/O-bound processes to wait behind it in the ready queue. This severely degrades CPU and I/O device utilization and inflates average waiting time."}, {"q": "How are Turnaround Time (TAT) and Waiting Time (WT) defined and computed?", "a": "Turnaround Time (TAT) is the total elapsed time from process arrival to process completion: TAT = Completion Time - Arrival Time. Waiting Time (WT) is the total time the process spent waiting in the ready queue: WT = Turnaround Time - Burst Time."}, {"q": "Can FCFS cause starvation? Why or why not?", "a": "No, FCFS is strictly starvation-free. Because processes are scheduled in exact order of arrival, every process in the ready queue is guaranteed to be executed once earlier processes terminate."}], "11": [{"q": "Why is Shortest Job First (SJF) mathematically optimal for waiting time?", "a": "SJF minimizes the sum of waiting times because executing short jobs first allows them to complete early and exit the system, reducing the remaining queue length and accumulated wait times for all other jobs."}, {"q": "Can SJF suffer from starvation? How is it resolved?", "a": "Yes. If there is a continuous arrival of short-burst processes, longer-burst processes may be postponed indefinitely (starvation). This is solved using 'Aging', which gradually increments the priority of waiting processes over time."}, {"q": "Why cannot pure SJF be implemented directly in general-purpose OS schedulers?", "a": "In real-world operating systems, the exact future CPU burst duration of a process cannot be known in advance. Schedulers must estimate future bursts using exponential moving averages of previous bursts: \u03c4_{n+1} = \u03b1 t_n + (1-\u03b1) \u03c4_n."}], "12": [{"q": "How does SRTN differ from non-preemptive SJF?", "a": "In SRTN (Shortest Remaining Time Next), if a new process arrives with a CPU burst shorter than the remaining burst time of the currently running process, the CPU is immediately preempted and allocated to the newly arrived process."}, {"q": "What is the primary overhead of SRTN compared to SJF?", "a": "SRTN incurs context-switch overhead due to frequent preemptions whenever shorter jobs arrive. Context switching requires saving registers, updating memory mappings, and invalidating CPU caches."}, {"q": "What happens if a newly arrived job has remaining time equal to the currently executing job?", "a": "Standard convention retains the currently running process to avoid an unnecessary context switch."}], "13": [{"q": "What is Priority Inversion and how is it resolved?", "a": "Priority Inversion happens when a low-priority process holds a mutual-exclusion resource required by a high-priority process, while a medium-priority process runs and preempts the low-priority process, indirectly starving the high-priority process. It is resolved using Priority Inheritance Protocol, where the lock holder temporarily inherits the high priority."}, {"q": "What is Aging in priority scheduling?", "a": "Aging is a technique where an operating system periodically increases the priority of processes that spend a long time waiting in the ready queue, preventing indefinite starvation of low-priority processes."}, {"q": "What convention is standard for priority numbers in operating systems?", "a": "In Unix and POSIX nice levels, smaller numerical values represent higher priority (e.g. priority 0 is higher than priority 10). In Windows, higher numbers represent higher priorities."}], "14": [{"q": "When does scheduling take place in non-preemptive priority scheduling?", "a": "Scheduling decisions occur only when the currently executing process either voluntarily yields the CPU, performs an I/O operation, or terminates. An arriving higher-priority process must wait in the ready queue until the running burst finishes."}, {"q": "What is the difference between Waiting Time and Response Time?", "a": "Waiting Time is the cumulative time a process spends waiting in the ready queue throughout its entire lifecycle. Response Time is the elapsed time from process arrival until its very first execution on the CPU."}], "15": [{"q": "What is context-switch overhead and what actions are taken during it?", "a": "Context switching is the administrative time taken by the OS to save the CPU state (program counter, registers, stack pointer) of the current process into its Process Control Block (PCB) and load the saved state of the next scheduled process. The CPU does no useful application work during this period."}, {"q": "How does the size of time quantum q affect Round Robin?", "a": "If q is too small, context-switch overhead dominates and CPU throughput degrades severely. If q is too large (larger than the maximum process burst), Round Robin degrades into First-Come First-Served (FCFS)."}, {"q": "What is the rule of thumb for selecting the time quantum q?", "a": "The time quantum should be chosen such that approximately 75% to 80% of CPU bursts are shorter than q, balancing responsiveness with low context-switch overhead."}], "16": [{"q": "Where does a preempted process get placed when a new process arrives at the same time tick?", "a": "Standard operating system convention adds the newly arriving process to the tail of the ready queue first, and then appends the preempted process behind it."}, {"q": "Why is Round Robin preferred for time-sharing operating systems?", "a": "Round Robin guarantees bounded response time: each of n processes gets at least 1/n of the CPU time in slices of at most q time units, preventing starvation and providing interactive responsiveness."}], "17": [{"q": "What are the 5 major CPU scheduling evaluation criteria?", "a": "1. CPU Utilization (percentage of time CPU is active); 2. Throughput (number of processes completed per unit time); 3. Turnaround Time (time from submission to completion); 4. Waiting Time (time spent in ready queue); 5. Response Time (time from submission to first response)."}, {"q": "What is the difference between CPU-bound and I/O-bound processes?", "a": "CPU-bound processes spend the majority of their time performing intensive computations and require long CPU bursts. I/O-bound processes spend most of their time waiting for I/O operations and require frequent but very short CPU bursts."}], "18": [{"q": "What is the difference between Multilevel Queue (MLQ) and Multilevel Feedback Queue (MLFQ)?", "a": "In Multilevel Queue (MLQ), processes are permanently assigned to a specific queue (e.g. system vs user) and cannot change queues. In Multilevel Feedback Queue (MLFQ), processes dynamically migrate between queues with different priorities and time quanta based on observed burst behavior."}, {"q": "Why are system processes given a separate, higher-priority queue than user processes?", "a": "System processes handle kernel tasks, device interrupts, page faults, and critical services that maintain overall OS stability and responsiveness; delaying them stalls user applications."}], "19": [{"q": "What is the difference between a Safe State and an Unsafe State in Banker's Algorithm?", "a": "A state is safe if there exists at least one sequence of process allocations <P1, P2, ... Pn> such that each process can satisfy its maximum resource claims and finish. An unsafe state is NOT necessarily deadlocked, but deadlock cannot be guaranteed to be avoided if processes claim their maximum resources."}, {"q": "What is the formula for the Need matrix in Banker's Algorithm?", "a": "Need[i][j] = Max[i][j] - Allocation[i][j], which represents the remaining resources process i may request before completing."}, {"q": "What is the time complexity of the safety algorithm in Banker's Algorithm?", "a": "The time complexity is O(m * n^2), where n is the number of processes and m is the number of resource types."}], "20": [{"q": "What are Coffman's four necessary conditions for deadlock?", "a": "1. Mutual Exclusion (resources cannot be shared); 2. Hold and Wait (processes hold allocated resources while requesting others); 3. No Preemption (resources cannot be forcibly taken); 4. Circular Wait (a circular chain of processes where each holds a resource requested by the next)."}, {"q": "What is the difference between Deadlock Avoidance and Deadlock Detection?", "a": "Deadlock Avoidance (e.g. Banker's Algorithm) inspects resource requests before granting them to ensure the system never enters an unsafe state. Deadlock Detection periodically checks allocation and request matrices after granting resources to identify if any deadlock currently exists."}, {"q": "What recovery strategies can an OS use once a deadlock is detected?", "a": "1. Process termination (terminate all deadlocked processes or abort one process at a time until the deadlock cycle is broken); 2. Resource preemption (preempt resources from selected victim processes and roll them back to a checkpointed safe state)."}], "21": [{"q": "What three criteria must every valid solution to the critical section problem satisfy?", "a": "1. Mutual Exclusion (at most one process can execute inside the critical section at any time); 2. Progress (if no process is in the critical section, only processes wishing to enter can participate in deciding who enters next, and this decision cannot be postponed indefinitely); 3. Bounded Waiting (a limit exists on the number of times other processes enter the critical section after a process has requested entry)."}, {"q": "What is the role of the 'turn' variable in Dekker's Algorithm?", "a": "When both processes set their intention flags (f0=1 and f1=1) simultaneously, the turn variable breaks the symmetry by designating which process has priority, forcing the other process to temporarily withdraw its flag and wait."}, {"q": "What is busy waiting / spinlocking and what is its disadvantage?", "a": "Busy waiting means a process repeatedly executes a loop testing a condition until it becomes true. Its major drawback is that it wastes CPU cycles that could otherwise be allocated to productive processes."}], "22": [{"q": "How does acquiring the lower-numbered fork first eliminate deadlock in Dining Philosophers?", "a": "It establishes a strict global resource ordering. Because philosopher 4 must pick fork 0 before fork 4, a circular wait chain (P0->F1->P1->F2->...->F0->P0) is impossible, mathematically breaking Coffman's circular wait condition."}, {"q": "Which of Coffman's 4 conditions is broken by resource ordering?", "a": "Circular Wait. In a strictly ordered resource hierarchy, a cycle of dependencies cannot exist in the resource allocation graph."}, {"q": "Can starvation still occur in Dining Philosophers even if deadlock is prevented?", "a": "Yes. If philosophers 1 and 3 alternate eating continuously, philosopher 2 (who sits between them) may be starved indefinitely from ever obtaining both adjacent forks at the same time."}], "23": [{"q": "Why are two counting semaphores (empty and full) needed in the bounded-buffer problem?", "a": "The 'empty' semaphore tracks remaining vacant slots (initialized to buffer capacity N); it blocks the producer when the buffer is full. The 'full' semaphore tracks available produced items (initialized to 0); it blocks the consumer when the buffer is empty."}, {"q": "Why must wait(empty) precede wait(mutex) in the producer to prevent deadlock?", "a": "If the producer acquired mutex first and then blocked on wait(empty) when the buffer is full, it would hold the mutex while sleeping, preventing the consumer from ever entering the critical section to consume an item and signal empty, creating an immediate deadlock."}, {"q": "Why was exec 3<>e used with named pipes (mkfifo) in the shell script?", "a": "Opening a FIFO normally blocks until both a reader and writer open it. Using '<>' opens the FIFO descriptor for both reading and writing simultaneously within the current shell process, preventing it from blocking on open."}]}
</script>

<script>
const G=`read :: Built-in command. It waits for you to type a line and stores it. "read n" stores the whole line in n. "read a b" splits the line on spaces: first word into a, the rest into b.
read -p :: -p "text" prints that text as a prompt before waiting for your input (the prompt only appears when you type at a keyboard).
read -a :: -a name stores every typed word as one element of an array. Typing 5 9 2 gives name[0]=5, name[1]=9, name[2]=2.
read -u :: -u N reads the line from file descriptor N instead of the keyboard. Here N is a pipe, so read WAITS until something is written into it. That waiting is how the semaphore blocks.
echo :: Prints its arguments followed by a newline. With > or >> the text goes into a file (or pipe) instead of the screen.
for :: Starts a loop. C-style for ((i=1;i<=n;i++)) means: start i at 1, repeat while i<=n, add 1 after every pass. "for k in 1 2" runs once for each listed word.
do :: Starts the loop body. Everything up to done is repeated.
done :: Ends the loop body that began with do.
while :: Repeats the body as long as the test after it succeeds (exit status 0 = true).
if :: Runs the commands after then when the test succeeds. Use [ ] for file and text tests, (( )) for number tests.
then :: Starts the commands that run when the if/elif test is true.
elif :: Means else-if. It is tried only when the earlier tests failed.
else :: Runs when every earlier test failed.
fi :: Ends an if block (if spelled backwards).
case :: case WORD in pattern) commands;; esac works like switch in C: it runs the branch whose pattern matches WORD.
esac :: Ends a case block (case spelled backwards).
in :: Introduces the list in "for x in list" or the patterns in "case x in".
continue :: Skips the rest of this loop pass and starts the next one (the loop step such as i++ still runs).
wait :: Pauses the script until all background jobs (started with &) have finished.
sleep :: Pauses for the given number of seconds, so you can watch the order of events.
exec :: With only redirections (exec 3>file) it opens file descriptors for the rest of the shell, so later commands such as flock 3 or echo >&3 can use them.
flock :: Locks a file (given by descriptor). If another process holds the lock, flock waits until it is released. It acts like a mutex or semaphore.
flock -u :: -u unlocks the descriptor, so a waiting process can continue.
mkfifo :: Creates a named pipe (FIFO), a special file where one process writes and another reads. A read waits until data arrives.
tail :: Prints the end of a file.
tail -n :: -n1 means only the last 1 line. Here it gives the current value of a shared variable stored in a file.
grep :: Searches text for a pattern and prints matching lines. It fails (exit status 1) when nothing matches, which lets || run the Not found message.
grep -n :: -n puts the line number in front of each match.
sed :: Stream editor that changes text line by line.
sed -i :: -i edits the file itself (in place) instead of printing the changed text.
find :: Walks through a directory and lists the items that pass its tests.
find -maxdepth :: -maxdepth 1 looks only in this folder, not in sub-folders.
find -type :: -type f keeps regular files only. -type d keeps directories only.
find -executable :: Keeps only files you are allowed to run.
wc :: Word count tool: counts lines, words or characters of its input.
wc -l :: -l counts lines.
wc -w :: -w counts words.
sort :: Sorts lines. Without options it sorts as text.
sort -n :: -n sorts as numbers, so 9 comes before 10.
rev :: Reverses each line character by character: abc becomes cba.
printf :: Formatted print. %s is a text slot, \\n is a new line, %.2f prints a decimal with 2 digits. printf "%s\\n" a b c prints each item on its own line.
awk :: A small text-processing language. BEGIN{...} runs once before any input, so here it just does the division and prints with printf.
awk -v :: -v name=value hands a shell value to awk as a variable (T, W and n here).
md5sum :: Prints a fingerprint (hash) of each file's content. Equal content gives equal hash, so duplicates are easy to spot.
xargs :: Takes the lines coming through the pipe and passes them as arguments to the command after it.
xargs -r :: -r means do nothing if the input is empty.
rm :: Deletes files.
rm -v :: -v (verbose) prints each file name as it is deleted.
gcc :: The C compiler. gcc a.c -o a turns a.c into the program a.
gcc -o :: -o NAME sets the name of the output program.
chmod :: Changes file permissions. +x adds the permission to execute.
fin :: Function we defined. It receives the process number ($1) and its finish time ($2), works out turnaround and waiting time, prints them and adds them to the totals.
add :: Function we defined. It puts every process that has arrived by now, and is not queued yet, at the back of the ready queue.
phil :: Function we defined: what one philosopher does (take forks, eat, put forks down).
producer :: Function we defined: makes items and puts them into the buffer.
consumer :: Function we defined: takes items out of the buffer.
: :: The do-nothing command (always succeeds). Used as an empty loop body so the while keeps polling.
[t :: Opens a test. [ -f x ] checks a file, [ "$a" = "$b" ] compares text. It must have a space after [ and before ]. Success means true.
]t :: Closes a [ ] test.
[i :: Starts an array index: a[i] is element number i of array a (counting starts at 0).
]i :: Ends an array index.
[ -f :: -f is true when the name is a regular file.
[ -d :: -d is true when the name is a directory.
[ -e :: -e is true when the name exists at all.
[ -z :: -z is true when the text is empty.
(( :: Starts arithmetic. Inside, variables need no $, = assigns, < > == compare, and the result is true when it is not zero.
)) :: Ends an arithmetic block.
$(( :: Arithmetic expansion: it calculates and the number replaces it. echo $((3+4)) prints 7.
$( :: Command substitution: runs the command inside and its output replaces it as text.
( :: Parenthesis. In arithmetic it sets the order of calculation. In name=( ... ) it makes an array.
) :: Closing parenthesis for ( ... ), $( ... ), or the end of a case pattern such as 1) .
() :: After a name, name(){ ... } defines a function that can be called by that name.
{ :: Starts a group of commands { a; b; } that act as one unit. Also starts a function body.
} :: Ends a group of commands or function body.
&& :: AND-then. The right side runs only if the left side succeeded (true).
|| :: OR-else. The right side runs only if the left side failed (false).
| :: Pipe. The output of the left command becomes the input of the right command.
> :: Redirects output into a file and overwrites it. N>file opens descriptor N on that file.
>> :: Appends output to the end of a file without erasing it.
< :: Takes input from a file or descriptor instead of the keyboard. Inside (( )) it means less-than.
<<< :: Here-string: the text on its right is fed to the command on its left as input.
<> :: Opens a file or pipe for reading AND writing. For a pipe this means opening never blocks.
& :: At the end of a command it starts that command in the background, so the script continues at once.
>& :: In echo >&3, it sends the output to descriptor 3 instead of the screen.
; :: Separates commands on one line, like pressing Enter.
;; :: Ends one branch of a case.
! :: NOT. !x is true when x is 0.
!= :: Not equal.
== :: Equal (comparison inside (( )) ).
<= :: Less than or equal.
>= :: Greater than or equal.
++ :: Adds 1 (t++ means t=t+1).
-- :: Subtracts 1. In --r[m] the subtraction happens first and the new value is used.
+= :: Add and assign: t+=5 means t=t+5. With ( ) it appends to an array: Q+=($j).
-= :: Subtract and assign: r[i]-=x means r[i]=r[i]-x.
= :: Assignment (a=5, no spaces around it) or, inside [ ], text comparison.
% :: Remainder after division: 17%5 is 2. n%i==0 means i divides n exactly.
? :: Ternary operator: condition ? valueIfTrue : valueIfFalse.
* :: Multiply inside (( )). Outside it is a wildcard meaning every file in this folder.
+ :: Add.
, :: Comma. Inside (( )) it separates several calculations that run one after another, left to right.
- :: Subtract.
/ :: Divide inside (( )), or the separator in a path such as ./hello.
. :: The current folder. ./hello runs the program hello from here.
~ :: Inside the sed text it means every Nth line, counting from the first number.
2>/dev/null :: Sends error messages (descriptor 2) to /dev/null, a bin that discards everything, so they stay hidden.
"str :: Text in double quotes stays together as ONE word even with spaces, and any $name inside is replaced by its value.
" :: Double quote. Quotes keep a value as one word even if it has spaces. Variables inside are still expanded.
'2~2d' :: sed program in single quotes (nothing inside is expanded). 2~2 means start at line 2 and take every 2nd line, d means delete it. So all even lines are deleted.
'seen[$1]++{print $2}' :: awk program. seen[$1] counts how many times this hash (column 1) appeared. ++ adds 1 after reading the old value, so the first time the value is 0 (false) and nothing prints. Next times it is true and column 2 (the file name) is printed.
awkB :: awk program in single quotes. BEGIN runs once, divides the totals by n and prints both averages with 2 decimals.
v:n :: Count of how many processes (or numbers) the program works with.
v:i|j|k :: Loop counter variables. Usually i is the process number.
v:t :: Time: the CPU clock (current time unit) in the scheduling programs.
v:a :: Arrival times: a[i] is when process i arrives. In question 3 it holds the typed numbers.
v:b :: Burst times: b[i] is how long process i needs the CPU.
v:r :: Remaining time of each process (scheduling), or the right fork number in question 22.
v:p :: Priority of each process (smaller number = higher priority). In Dekker's program p is the process function.
v:q :: The time quantum for Round Robin, or the queue number of each process in the multilevel queue.
v:cs :: Context-switch time: time lost each time the CPU changes process.
v:m :: Number of the process chosen to run next (0 means none chosen).
v:d :: d[i] is 1 once process i has finished (done flag).
v:s :: Helper: a typed string, a sorted array, or an already-queued flag, depending on the program.
v:T|W :: Running totals of turnaround time (T) and waiting time (W) used for the averages. In Banker's, W is the Work/Available vector.
v:tat :: Turnaround time = finish time minus arrival time.
v:wt :: Waiting time = turnaround time minus burst time.
v:Q :: The ready queue (an array). The process at the front runs next.
v:cur :: The process running right now (0 means CPU idle).
v:left :: How many processes have not finished yet.
v:c :: Menu choice (question 17) or the pass counter (Banker's).
v:x :: How long the process runs in this turn: the smaller of quantum and remaining time.
v:v :: The sort key of one process (arrival, burst, remaining time or priority).
v:best :: The smallest key found so far.
v:l :: Left fork number (the lower-numbered fork after swapping).
v:o|me :: me is this process number (0 or 1) and o is the other one (Dekker's).
v:f :: Finished flags (Banker's), or a pipe/file name.
v:e :: Pipe that counts empty slots in the buffer.
v:A :: Allocation table (flat array: A[i*m+j] is process i, resource j).
v:M :: Max table (flat array).
v:R :: Request table (flat array).
v:ok :: 1 while the process can still run with the available resources.
v:g :: Function that reads the last line of a file (Dekker's program).
v:turn|f0|f1 :: Files used as shared variables in Dekker's algorithm.
v:fork :: Prefix of the file names used as forks (fork0 ... fork4).
v:hello :: The C program file.
v:buf :: Name of the shared buffer.
v:null|dev :: Part of /dev/null, the discard file.
v:Philosopher|Produced|Consumed :: Plain text that is printed.`;
</script>

<script>

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// Parse Questions from #d
const D = $('d').textContent.split(/^@@ ?/m).filter(b => b.trim()).map(b => {
  const L = b.split('\n');
  const [g, t, v] = L[0].split('|').map(s => s.trim());
  const code = [], notes = [];
  L.slice(1).forEach(l => {
    if (!l.trim()) return;
    const [c, n] = l.split(' #@ ');
    code.push(c);
    notes.push((n || '').trim());
  });
  return { g, t, v: v || '', code, notes };
});

const OUT = JSON.parse($('o').textContent);
const VIVA = JSON.parse($('viva-data').textContent);

// State
let cur = 0;
let st = -1;
let currentTab = 'script';
let categoryFilter = 'all';
let practiceMode = false;
let explainMode = false;
let showCommentsInScript = false;
let EX = [];

// Local Storage Keys
const THEME_KEY = 'oslab_theme';
const MASTER_KEY = 'oslab_mastered';
const NOTEBOOK_KEY = 'oslab1';

// Mastered tracking
function getMastered() {
  try { return JSON.parse(localStorage.getItem(MASTER_KEY)) || {}; } catch(e) { return {}; }
}
function toggleMastered(idx) {
  const m = getMastered();
  m[idx + 1] = !m[idx + 1];
  localStorage.setItem(MASTER_KEY, JSON.stringify(m));
  updateProgressUI();
  renderNav();
  renderCurrentQuestion();
}
function isMastered(idx) {
  return !!getMastered()[idx + 1];
}
function updateProgressUI() {
  const m = getMastered();
  const count = Object.values(m).filter(Boolean).length;
  $('m-count').textContent = count;
  $('m-fill').style.width = Math.round((count / D.length) * 100) + '%';
}

// Theme Handling
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
  }
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
}
initTheme();

// Build Nav
function renderNav() {
  const q = ($('sq')?.value || '').toLowerCase();

  let lg = '';

  D.forEach((d, i) => {
    const qNum = i + 1;

      (categoryFilter === 'mastered' ? m[qNum] : d.g === categoryFilter);
    const matchesSearch = !q || (d.t + ' ' + d.code.join(' ') + ' ' + d.notes.join(' ')).toLowerCase().includes(q);

    if (d.g !== lg) {
      h += `<h4>${esc(d.g)}</h4>`;
      lg = d.g;
    }
    
    const masteredIcon = m[qNum] ? '⭐' : '';
    const activeClass = i === cur ? 'on' : '';
    h += `<a href="#q${qNum}" class="${activeClass}" onclick="show(${i})">
      <span><span class="q-badge">${qNum}</span>${esc(d.t.replace(/^\\d+\\.\\s*/, ''))}</span>
      <span class="nav-status">${masteredIcon}</span>
    </a>`;
  });

  if (!h) {
    h = `<p class="say" style="text-align:center;color:var(--mut)">No matching questions found.</p>`;
  }
  $('nav-list').innerHTML = h;
}

// Code Renderer with Syntax Highlighter & Explain Mode Tokens
function renderCodeLines(d) {
  EX = [];
  const linesToRender = showCommentsInScript 
    ? [`#!/usr/bin/env bash`, `# ${d.t}`, ...d.code.map((c, k) => d.notes[k] ? `${c} # ${d.notes[k]}` : c)]
    : d.code;

  return linesToRender.map((c, k) => {
    if (explainMode) {
      return `<span class="ln">${tk(c, d.notes[k] || '')}</span>`;
    } else {
      return `<span class="ln">${syntaxHighlight(c)}</span>`;
    }
  }).join('\n');
}

// Syntax Highlighter
function syntaxHighlight(code) {
  if (/^\s*#/.test(code)) return `<span class="sh-com">${esc(code)}</span>`;
  
  let html = '';
  let i = 0;
  const len = code.length;
  
  while (i < len) {
    const rem = code.slice(i);
    
    // Comments
    if (rem.startsWith('#') && (i === 0 || /\s/.test(code[i-1]))) {
      html += `<span class="sh-com">${esc(rem)}</span>`;
      break;
    }
    
    // Double quoted string
    let m = rem.match(/^"([^"\\]|\\.)*"/);
    if (m) {
      html += `<span class="sh-str">${esc(m[0])}</span>`;
      i += m[0].length;
      continue;
    }
    
    // Single quoted string
    m = rem.match(/^'[^']*'/);
    if (m) {
      html += `<span class="sh-str">${esc(m[0])}</span>`;
      i += m[0].length;
      continue;
    }
    
    // Parameter expansion ${...} or $((...))
    m = rem.match(/^\$(\{[^}]+\}|\(\([^)]+\)\)|\([A-Za-z0-9_ -]+\))/);
    if (m) {
      html += `<span class="sh-var">${esc(m[0])}</span>`;
      i += m[0].length;
      continue;
    }
    
    // Variable $name, $1, $@, etc.
    m = rem.match(/^\$[A-Za-z0-9_#@?*!]/);
    if (m) {
      html += `<span class="sh-var">${esc(m[0])}</span>`;
      i += m[0].length;
      continue;
    }
    
    // Keywords and shell commands
    m = rem.match(/^(read|echo|for|while|do|done|if|then|elif|else|fi|case|esac|grep|sed|awk|find|wc|sort|xargs|rm|gcc|chmod|exec|flock|mkfifo|tail|rev|sleep|wait|printf|continue|exit|function)\b/);
    if (m) {
      html += `<span class="sh-kw">${esc(m[0])}</span>`;
      i += m[0].length;
      continue;
    }
    
    // Operators
    m = rem.match(/^(&&|\|\||<<<|>>|<>|\|\||==|!=|<=|>=|\+=|-=|;;|\(\)|\(\(|\)\))/);
    if (m) {
      html += `<span class="sh-op">${esc(m[0])}</span>`;
      i += m[0].length;
      continue;
    }
    
    // Numbers
    m = rem.match(/^\b\d+\b/);
    if (m) {
      html += `<span class="sh-num">${esc(m[0])}</span>`;
      i += m[0].length;
      continue;
    }
    
    html += esc(code[i]);
    i++;
  }
  return html;
}

function toggleComments() {

}

function resetDefaultProcesses(qNum) {

function executeTerminalRun(qNum) {
  const term = $('runner-term');
  const o = OUT[qNum] || {};

  switch(qNum) {
    case 1: {
      const n = parseInt($('run_inp1')?.value, 10);
      let isP = n >= 2;
      for (let i = 2; i * i <= n; i++) { if (n % i === 0) { isP = false; break; } }
      term.textContent = `$ bash q1.sh\nNumber: ${n}\n${isP ? 'Prime' : 'Not prime'}`;
      break;
    }
    case 2: {
      const s = ($('run_inp2')?.value || '').trim();
      const isPal = s === s.split('').reverse().join('');
      term.textContent = `$ bash q2.sh\nWord or number: ${s}\n${isPal ? 'Palindrome' : 'Not palindrome'}`;
      break;
    }
    case 3: {
      const raw = $('run_inp3')?.value || '';
      const nums = raw.trim().split(/\s+/).map(x => parseInt(x, 10)).filter(x => !isNaN(x)).sort((a,b) => a - b);
      term.textContent = `$ bash q3.sh\nNumbers: ${raw}\nSmallest: ${nums[0]}  Largest: ${nums[nums.length - 1]}`;
      break;
    }
    case 4: {
      const pat = $('run_inp4_s')?.value || '';
      const f = $('run_inp4_f')?.value || 'notes.txt';
      const lines = ["apple", "banana", "apple pie", "orange", "pineapple"];
      const matches = lines.map((l, idx) => l.includes(pat) ? (idx+1) + ':' + l : null).filter(Boolean);
      term.textContent = `$ bash q4.sh\nString: ${pat}\nFile: ${f}\n${matches.length ? matches.join('\n') : 'Not found'}`;
      break;
    }
    case 5: {
      const d = $('run_inp5')?.value || 'demo';
      term.textContent = `$ bash q5.sh ${d}\nFiles: 3\nDirs: 2\nExecutables: 1`;
      break;
    }
    case 6: {
      const n = ($('run_inp6')?.value || '').trim();
      const res = n.endsWith('/') ? 'Directory' : n.includes('.') ? 'File' : 'Does not exist';
      term.textContent = `$ bash q6.sh\nName: ${n}\n${res}`;
      break;
    }
    case 7: {
      const f = $('run_inp7')?.value || 'hello.c';
      const out = f.replace(/\.c$/, '');
      term.textContent = `$ bash q7.sh ${f}\ngcc ${f} -o ${out}\nchmod +x ${out}\n./${out}\nHello OS`;
      break;
    }
    case 8: {
      const f = $('run_inp8')?.value || 'nums.txt';
      term.textContent = `$ bash q8.sh ${f}\nsed -i '2~2d' ${f}\n$ cat ${f}\n1\n3\n5\n7`;
      break;
    }
    case 9: {
      term.textContent = `$ bash q9.sh\nremoved 'doc1_copy.pdf'\nremoved 'report_old.docx'\n$ ls\ndoc1.pdf  report.docx  image.png`;
      break;
    }
    case 17: { // General Scheduler (User picks algorithm & inputs)
      const algo = parseInt($('run_q17_algo')?.value || '3', 10);
      const qVal = parseInt($('run_q17_q')?.value || '2', 10);
      const raw = ($('run_sched_inp')?.value || '').trim().split('\n').map(l => l.trim()).filter(Boolean);
      if (!raw.length) { term.textContent = 'Please enter process count and rows.'; break; }
      
      const n = parseInt(raw[0], 10);
      const P = [];
      for (let i = 1; i <= n && i < raw.length; i++) {
        const parts = raw[i].split(/\s+/).map(Number);
        P.push([parts[0] || 0, parts[1] || 1, parts[2] != null ? parts[2] : 1]);
      }
      if (!P.length) { term.textContent = 'No valid processes.'; break; }

      // Map algo number to name
      const algoNames = { 1: 'FCFS', 2: 'SJF', 3: 'SRTN', 4: 'PRIORITY-P', 5: 'PRIORITY-NP', 6: 'RR' };
      const algoKeys = { 1: 'fcfs', 2: 'sjf', 3: 'srtn', 4: 'pp', 5: 'pnp', 6: 'rr' };
      
      let outText = `$ bash q17.sh\n1 FCFS 2 SJF 3 SRTN 4 PRIORITY-P 5 PRIORITY-NP 6 RR\nChoose: ${algo} (${algoNames[algo]})\nProcesses: ${n}\n`;
      if (algo === 6) outText += `Quantum: ${qVal}\n`;
      P.forEach((p, idx) => {
        outText += `P${idx+1} arrival burst priority: ${p[0]} ${p[1]} ${p[2]}\n`;
      });

      // Run scheduler calculation
      const tl = algo === 6 ? rr(P, qVal, 0) : pre(P, algoKeys[algo]);
      let tt = 0, tw = 0;
      P.forEach((p, i) => {
        const finish = tl.lastIndexOf(i) + 1;
        const tat = finish - p[0];
        const wt = tat - p[1];
        tt += tat;
        tw += wt;
        outText += `P${i+1} finish=${finish} TAT=${tat} WT=${wt}\n`;
      });
      outText += `Average TAT=${(tt / P.length).toFixed(2)}  Average WT=${(tw / P.length).toFixed(2)}`;
      term.textContent = outText;
      break;
    }
    case 10: { // FCFS
      const raw = ($('run_sched_inp')?.value || '').trim().split('\n').map(l => l.trim()).filter(Boolean);
      if (!raw.length) { term.textContent = 'Please enter process count and arrival burst pairs.'; break; }
      const n = parseInt(raw[0], 10);
      const procs = [];
      for (let i = 1; i <= n && i < raw.length; i++) {
        const [a, b] = raw[i].split(/\s+/).map(Number);
        procs.push({ id: i, a: a || 0, b: b || 1 });
      }
      if (!procs.length) { term.textContent = 'No valid processes parsed.'; break; }
      // Sort by arrival for FCFS
      let t = 0, tt = 0, tw = 0;
      let outText = `$ bash q10.sh\nProcesses: ${n}\n`;
      procs.forEach(p => {
        outText += `P${p.id} arrival burst: ${p.a} ${p.b}\n`;
        if (t < p.a) t = p.a;
        t += p.b;
        const tat = t - p.a;
        const wt = tat - p.b;
        tt += tat;
        tw += wt;
        outText += `P${p.id} finish=${t} TAT=${tat} WT=${wt}\n`;
      });
      outText += `Average TAT=${(tt / procs.length).toFixed(2)}  Average WT=${(tw / procs.length).toFixed(2)}`;
      term.textContent = outText;
      break;
    }
    default: {
      term.textContent = `$ ${o.c}\n${o.i ? o.i + '\n' : ''}${o.o}`;
      break;
    }
  }
}


function copyCurrentScript(btn) {
  const code = D[cur].code.join('\n');
  navigator.clipboard.writeText(code).then(() => {
    const origText = btn.innerHTML;
    btn.innerHTML = '✓ Copied!';
    setTimeout(() => btn.innerHTML = origText, 1800);
  }).catch(() => {
    btn.textContent = 'Copy failed';
  });
}

// Download .sh
function downloadCurrentScript() {
  const qNum = cur + 1;
  const pad = qNum < 10 ? '0' + qNum : qNum;
  const cleanName = D[cur].t.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  const fileName = `${pad}_${cleanName}.sh`;
  const content = `#!/usr/bin/env bash\n# ${D[cur].t}\n\n` + D[cur].code.join('\n') + '\n';
  
  const blob = new Blob([content], { type: 'application/x-sh' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Step Walkthrough
function step(dir) {
  const d = D[cur];
  let k = st;
  do k += dir; while (k >= 0 && k < d.code.length && !d.notes[k]);
  if (k < 0 || k >= d.code.length) return;
  st = k;
  document.querySelectorAll('.ln').forEach((e, j) => e.classList.toggle('on', j === k));
  $('say').innerHTML = `<strong>Line ${k + 1}:</strong> ${esc(d.notes[k])}`;
}

// Simulator functions
function runSim1() {
  const n = parseInt($('sim1_n').value, 10);
  const out = $('sim1_out');
  if (isNaN(n) || n < 0) {
    out.innerHTML = '<span style="color:var(--danger)">Please enter a valid non-negative integer.</span>';
    return;
  }
  if (n < 2) {
    out.innerHTML = `<strong>Result:</strong> <span style="color:var(--danger)">Not prime</span><br><small style="color:var(--mut)">0 and 1 are not prime by definition.</small>`;
    return;
  }
  let isPrime = true;
  let factor = -1;
  const limit = Math.floor(Math.sqrt(n));
  const checked = [];
  
  for (let i = 2; i * i <= n; i++) {
    checked.push(i);
    if (n % i === 0) {
      isPrime = false;
      factor = i;
      break;
    }
  }
  
  if (isPrime) {
    out.innerHTML = `<strong>Result:</strong> <span style="color:var(--success);font-weight:700">Prime</span><br>
    <small style="color:var(--mut)">Checked divisors: ${checked.length ? checked.join(', ') : 'none needed'} up to &lfloor;&radic;${n}&rfloor; = ${limit}. No divisor divides ${n} evenly.</small>`;
  } else {
    out.innerHTML = `<strong>Result:</strong> <span style="color:var(--danger);font-weight:700">Not prime</span><br>
    <small style="color:var(--mut)">Composite: divisible by ${factor} (${factor} &times; ${n / factor} = ${n}).</small>`;
  }
}

function runSim2() {
  const s = ($('sim2_s').value || '').trim();
  const rev = s.split('').reverse().join('');
  const isPal = s === rev;
  $('sim2_out').innerHTML = `

    <strong>Reversed:</strong> "${esc(rev)}"<br>

}

function runSim3() {
  const str = $('sim3_s').value.trim();
  const nums = str.split(/\s+/).map(x => parseInt(x, 10)).filter(x => !isNaN(x));
  if (!nums.length) {
    $('sim3_out').innerHTML = '<span style="color:var(--danger)">Enter at least one valid number.</span>';
    return;
  }
  const sorted = [...nums].sort((a,b) => a - b);
  $('sim3_out').innerHTML = `
    <strong>Original Array:</strong> [ ${nums.join(', ')} ]<br>
    <strong>Sorted (sort -n):</strong> [ ${sorted.join(', ')} ]<br>

    <strong>Largest \${s[-1]}:</strong> <span style="color:var(--ac);font-weight:700">${sorted[sorted.length-1]}</span>

}

function runSim4() {
  const lines = ($('sim4_f').value || '').split('\n');
  const pat = ($('sim4_s').value || '').trim();
  if (!pat) {
    $('sim4_out').innerHTML = '<span style="color:var(--warning)">Enter a search pattern.</span>';
    return;
  }
  const matches = [];
  lines.forEach((l, idx) => {
    if (l.includes(pat)) {
      matches.push(`<strong>${idx+1}:</strong> ` + esc(l).replace(new RegExp(esc(pat), 'g'), `<mark class="gd">${esc(pat)}</mark>`));
    }
  });
  if (matches.length) {
    $('sim4_out').innerHTML = matches.join('<br>');
  } else {
    $('sim4_out').innerHTML = '<span style="color:var(--danger)">Not found</span> (exit status 1)';
  }
}

function runGantt(v) {
  const rows = [...document.querySelectorAll('#gantt-input-table tbody tr')];
  let P = rows.map(r => [...r.querySelectorAll('input')].map(x => Math.max(0, parseInt(x.value, 10) || 0)));
  if (v === 'mlq') P = P.map(p => [0, p[1], p[2]]);
  
  const qVal = $('q') ? Math.max(1, parseInt($('q').value, 10) || 1) : 2;
  const csVal = $('cs') ? Math.max(0, parseInt($('cs').value, 10) || 0) : 0;
  
  const tl = v.startsWith('rr') ? rr(P, qVal, csVal) : pre(P, v === 'mlq' ? 'pnp' : v);
  
  const seg = [];
  tl.forEach((x, t) => {
    const s = seg[seg.length - 1];
    if (s && s.x === x) s.n++;
    else seg.push({ x, n: 1, t });
  });

  const bg = x => x === -1 ? 'var(--bd)' : x === -2 ? 'repeating-linear-gradient(45deg,#555,#555 4px,#333 4px,#333 8px)' : `hsl(${(x*75+20)%360} 70% 45%)`;
  
  let tw = 0, tt = 0;
  const tableRows = P.map((p, i) => {
    const f = tl.lastIndexOf(i) + 1;
    const tat = f - p[0];
    const wt = tat - p[1];
    tt += tat;
    tw += wt;
    return `<tr>
      <td><strong>P${i+1}</strong></td>
      <td>${p[0]}</td>
      <td>${p[1]}</td>
      <td>${f}</td>

function pre(P, a) {
  let t = 0, rem = P.map(p => p[1]), tl = [], cur = -1, left = P.length;
  const key = { fcfs: i => P[i][0], sjf: i => P[i][1], srtn: i => rem[i], pp: i => P[i][2], pnp: i => P[i][2] }[a];
  const pm = a === 'srtn' || a === 'pp';
  while (left) {
    const c = P.map((_, i) => i).filter(i => P[i][0] <= t && rem[i] > 0);
    if (!c.length) { tl.push(-1); t++; continue; }
    if (cur < 0 || pm) cur = c.reduce((m, i) => key(i) < key(m) ? i : m);
    tl.push(cur); rem[cur]--; t++;
    if (!rem[cur]) { left--; cur = -1; }
  }
  return tl;
}

function rr(P, q, cs) {
  let t = 0, rem = P.map(p => p[1]), Q = [], tl = [], add = new Set(), left = P.length;
  const arr = () => P.forEach((p, i) => { if (p[0] <= t && !add.has(i)) { add.add(i); Q.push(i); } });
  arr();
  while (left) {
    if (!Q.length) { tl.push(-1); t++; arr(); continue; }
    const i = Q.shift();
    const x = Math.min(q, rem[i]);
    for (let k = 0; k < x; k++) { tl.push(i); t++; arr(); }
    rem[i] -= x;
    if (rem[i]) Q.push(i);
    else left--;
    if (cs && left) for (let k = 0; k < cs; k++) { tl.push(-2); t++; arr(); }
  }
  return tl;
}

// Practice Mode Engine
let DR = {}, MK = [], PS = [], PMd = [];
const ld = () => { try { return JSON.parse(localStorage.getItem(NOTEBOOK_KEY)) || {}; } catch(e) { return {}; } };
const sv = o => { try { localStorage.setItem(NOTEBOOK_KEY, JSON.stringify(o)); } catch(e) {}; };
const kk = t => t.replace(/\s+/g, ' ').replace(/ ?([()<>=|&,+*\/%!?:{}\[\]-]) ?/g, '$1');

function ncm(c) {
  let o = '', q = '';
  for (let i = 0; i < c.length; i++) {
    const x = c[i];
    if (q) { if (x === q && c[i-1] !== '\\') q = ''; o += x; continue; }
    if (x === '"' || x === "'") { q = x; o += x; continue; }
    if (x === '#' && (i === 0 || /\s/.test(c[i-1]))) { while (i < c.length && c[i] !== '\n') { o += ' '; i++; } i--; continue; }
    o += x;
  }
  return o;
}

function stm(code0) {
  const code = ncm(code0), out = [], L = code.length;
  let st = 0, dp = 0, bd = 0, q = '';
  const add = (t, a) => out.push({ t: t.replace(/\s+/g, ' '), k: kk(t), a, b: a + t.length, l: code.slice(0, a).split('\n').length });
  const cut = i => {
    const raw = code.slice(st, i), t = raw.trim();
    if (t) {
      const a = st + raw.indexOf(t), m = t.match(/^(then|do|else)\s+(\S[\s\S]*)$/);
      if (m) { add(m[1], a); add(m[2], a + t.length - m[2].length); }
      else add(t, a);
    }
    st = i + 1;
  };
  for (let i = 0; i < L; i++) {
    const c = code[i], p = code[i-1], n = code[i+1];
    if (q) { if (c === q && p !== '\\') q = ''; continue; }
    if (c === '"' || c === "'") { q = c; continue; }
    if (c === '$' && n === '{') { bd++; i++; continue; }
    if (bd) { if (c === '}') bd--; continue; }
    if (c === '(') dp++;
    else if (c === ')') { if (dp) dp--; }
    else if (!dp && (c === ';' || c === '\n' || (c === '&' && n !== '&' && p !== '&' && p !== '>'))) {
      if (c === '\n' && /(\||&&|\\)\s*$/.test(code.slice(st, i).replace(/\s#.*$/, ''))) continue;
      cut(i);
    }
  }
  cut(L);
  return out;
}

function lint(code) {
  const E = [], ls = code.split('\n'), last = ls.length;
  const cl = ls.map(l => {
    let o = '', q = '';
    for (let i = 0; i < l.length; i++) {
      const c = l[i];
      if (q) { if (c === q && l[i-1] !== '\\') q = ''; continue; }
      if (c === '"' || c === "'") { q = c; o += '""'; continue; }
      if (c === '#' && (i === 0 || /\s/.test(l[i-1]))) break;
      o += c;
    }
    return { t: o.replace(/\$\{[^}]*\}/g, 'V'), u: !!q };
  });
  const e = (l, type, msg) => E.push({ l, type, msg, bash: 'bash: line ' + l + ': ' + msg });
  cl.forEach((c, i) => {
    const n = i + 1, t = c.t, nx = (cl.slice(i+1).find(x => x.t.trim()) || { t: '' }).t.trim();
    if (c.u) e(n, 'unclosed quote', 'unexpected EOF while looking for matching quote');
    if (/\b(if|elif)\b/.test(t) && !/\bthen\b/.test(t) && !/^then\b/.test(nx)) e(n, 'missing then', 'syntax error: "then" is missing after this if/elif');
    if (/\b(for|while|until)\b/.test(t) && !/\bdo\b/.test(t) && !/^do\b/.test(nx)) e(n, 'missing do', 'syntax error: "do" is missing after this loop header');
    if (/(\]|\)\))\s+(then|do)\b/.test(t)) e(n, 'missing ; before then/do', 'syntax error near unexpected token "' + t.match(/\s(then|do)\b/)[1] + '" (write ; or a new line before it)');
    if (/(^|[\s;&|(])\[(?![\s\[])/.test(t) || /\[ [^\]]*[^\s\]]\]/.test(t)) e(n, 'spaces inside [ ]', 'command not found (a [ ] test needs a space after [ and before ])');
    if (/(^|;)\s*[A-Za-z_]\w*( =|= )\s*\S/.test(t) && !/^\s*(for|if|while)\b/.test(t)) e(n, 'spaces around = in assignment', 'command not found (write n=5 with no spaces around =)');
    const o = (t.match(/\(\(/g) || []).length, closeP = (t.match(/\)\)/g) || []).length;
    if (o > closeP || (closeP > o && !/\$\(|=\(/.test(t))) e(n, 'unbalanced (( ))', 'syntax error: unbalanced (( )) in arithmetic');
  });
  return E.sort((a,b) => a.l - b.l);
}

function lcs(S, M) {
  const n = S.length, m = M.length, T = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      T[i][j] = S[i].k === M[j].k ? T[i+1][j+1] + 1 : Math.max(T[i+1][j], T[i][j+1]);
  const r = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (S[i].k === M[j].k) { r.push([i, j]); i++; j++; }
    else if (T[i+1][j] >= T[i][j+1]) i++;
    else j++;
  }
  return r;
}

function dr() {

function prun(auto) {
  const code = ($('pta')?.value || '').replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'");
  const d = D[cur];
  const R = $('prs');
  if (!code.trim()) {
    R.innerHTML = '<div class="banner warn">Write something first. Press Hint if you are stuck.</div>';
    return;
  }
  const S = stm(code), M = stm(d.code.join('\n')), Le = lint(code), mt = lcs(S, M);
  PS = S; PMd = M; MK = [];
  mt.forEach(([i, j]) => { S[i].ok = 1; M[j].got = 1; });

  let pi = 0, pj = 0;
  [...mt, [S.length, M.length]].forEach(([i, j]) => {
    const gs = [], gm = [];
    for (let x = pi; x < i; x++) gs.push(x);
    for (let y = pj; y < j; y++) gm.push(y);
    const n = Math.min(gs.length, gm.length);
    for (let x = 0; x < n; x++) MK.push({ y: 'wrong line (typo or logic)', s: gs[x], m: gm[x] });
    for (let x = n; x < gs.length; x++) MK.push({ y: 'extra line', s: gs[x] });
    for (let x = n; x < gm.length; x++) MK.push({ y: 'missing step', m: gm[x], after: i - 1 });
    pi = i + 1; pj = j + 1;
  });

  MK.forEach((m, x) => { m.id = x; if (m.s != null) S[m.s].mk = m; });
  const ok = !Le.length && !MK.length;
  const gh = {};
  MK.filter(m => m.m != null && m.s == null).forEach(m => { const l = m.after >= 0 ? S[m.after].l : 0; (gh[l] = gh[l] || []).push(m); });

  const note = m => d.notes[PMd[m].l - 1] || 'a line of the model answer';
  const ghost = m => `<div class="gh">⛔ Missing step: ${esc(note(m.m))} <button onclick="fx(${m.id})">Insert it</button></div>`;

  let h = (gh[0] || []).map(ghost).join('');
  code.split('\n').forEach((ln, k) => {
    const n = k + 1, sts = S.filter(s => s.l === n), bad = sts.some(s => !s.ok), lerr = Le.filter(x => x.l === n);
    h += `<div class="pr ${bad || lerr.length ? 'bad' : sts.length ? 'ok' : ''}"><i>${n}</i><span>${esc(ln)}</span></div>`;
    lerr.forEach(x => h += `<div class="gh">❌ Syntax problem: <strong>${esc(x.type)}</strong>. ${esc(x.msg)}</div>`);
    sts.filter(s => !s.ok).forEach(s => {
      const m = s.mk, e = m && m.m != null ? PMd[m.m] : null;
      h += '<div class="gh">' + (e ? `❌ Expected: <code>${esc(e.t)}</code> <button onclick="fx(${m.id})">Apply fix</button>` : `❌ Extra or misplaced statement. <button onclick="fx(${m.id})">Remove</button>`) + '</div>';
    });
    (gh[n] || []).forEach(m => h += ghost(m));
  });

  const ban = ok ? '<div class="banner good">✅ Perfect match! Every statement matches the tested model answer.</div>' : Le.length ? `<div class="banner err">❌ Syntax Error: Fix syntax problems below first.</div>` : '<div class="banner warn">⚠️ Logic Differences: Review highlighted lines.</div>';
  R.innerHTML = ban + `<div style="margin:10px 0">${h}</div>`;

  if (!auto) {
    const s = ld();
    s.q = s.q || {}; s.q[cur + 1] = s.q[cur + 1] || { a: 0 };
    s.q[cur + 1].a++;
    if (ok) s.q[cur + 1].ok = 1;
    sv(s);
  }
}

function fx(id) {
  const m = MK[id], ta = $('pta');
  let c = ta.value;
  if (m.m != null && m.s != null) {
    const s = PS[m.s];
    c = c.slice(0, s.a) + PMd[m.m].t + c.slice(s.b);
  } else if (m.s != null) {
    const s = PS[m.s];
    c = c.slice(0, s.a) + c.slice(s.b);
  } else {
    const p = m.after >= 0 ? PS[m.after].b : -1;
    c = p < 0 ? PMd[m.m].t + '\n' + c : c.slice(0, p) + '\n' + PMd[m.m].t + c.slice(p);
  }
  ta.value = c;
  dr();
  prun(true);
}

// Explain Mode Tooltip Dictionary Logic
const DICT = {}, V = {};
G.split('\n').forEach(l => {
  const k = l.indexOf(' :: ');
  if (k < 0) return;
  const key = l.slice(0, k), tx = l.slice(k + 4);
  key.startsWith('v:') ? key.slice(2).split('|').forEach(n => V[n] = tx) : DICT[key] = tx;
});

const CMDS = new Set(['read','grep','sed','find','wc','sort','tail','xargs','rm','gcc','flock','awk','chmod','[t']);
const TR = /2>\/dev\/null|"(?:[^"$]|\$(?![({]))*"|'[^']*'|\$\(\(|\$\(|\$\{[^}]*\}|\$[A-Za-z_]\w*|\$[0-9#@?*]|<<<|>>|&&|\|\||;;|<=|>=|==|!=|\+\+|--|\+=|-=|<>\(\)|(?<=\s)-[A-Za-z]+|[A-Za-z_]\w*|\d+|\(\(|\)\)|\S/g;

function toks(line) {
  const o = []; let m, cmd = '';
  TR.lastIndex = 0;
  while (m = TR.exec(line)) {
    const t = m[0], i = m.index;
    o.push({ t, i, cmd });
    let k = t;
    if (t === '[') k = line[i+1] === ' ' ? '[t' : '[i';
    if (CMDS.has(k)) cmd = k === '[t' ? '[' : k;
  }
  return o;
}

const nm = n => /^\d$/.test(n) ? 'argument ' + n : 'variable ' + n;
function pat(t) {
  const s = t.slice(2, -1);
  let m;
  if (m = s.match(/^#(\w+)\[@\]$/)) return 'Number of elements in array ' + m[1] + '.';
  if (m = s.match(/^(\w+)\[@\]:(\d+)$/)) return 'Elements of array ' + m[1] + ' starting from index ' + m[2] + ' (:1 drops first element).';
  if (m = s.match(/^(\w+)\[@\]$/)) return 'All elements of array ' + m[1] + ' as separate words.';
  if (m = s.match(/^(\w+)\[(-?\w+)\]$/)) return 'Element ' + m[2] + ' of array ' + m[1] + ' (-1 means last element).';
  if (m = s.match(/^(\w+)%(.+)$/)) return 'Strips shortest match of "' + m[2] + '" from end of ' + nm(m[1]) + '.';
  if (m = s.match(/^(\w+):-(.*)$/)) return 'Value of ' + nm(m[1]) + ' or default "' + m[2] + '".';
  return 'Parameter expansion: replaced by value described inside braces.';
}

function ex(o, line) {
  const t = o.t, nx = line[o.i + t.length] || '', pv = line[o.i - 1] || '';
  let k = t, b;
  if (t === '[') k = nx === ' ' ? '[t' : '[i';
  else if (t === ']') k = pv === ' ' ? ']t' : ']i';
  else if (t === '&' && pv === '>') k = '>&';
  else if (/^-[A-Za-z]/.test(t)) k = o.cmd + ' ' + t;
  else if (t.length > 1 && t[0] === '"') k = '"str';
  else if (t[0] === "'" && t.length > 1) k = t.startsWith("'BEGIN") ? 'awkB' : t;

  b = DICT[k] || DICT[t];
  if (k === '"str') b += ' Here: ' + t;
  if (!b && t.startsWith('${')) b = pat(t);
  if (!b && t[0] === '$') {
    const n = t.slice(1);
    b = '$ reads variable (' + n + '). ' + (/^\d$/.test(n) ? '$1 is first argument, $2 second.' : V[n] || '');
  }
  if (!b && /^\d+$/.test(t)) b = (nx === '>' || nx === '<') ? 'File descriptor ' + t : 'The number ' + t + '.';
  if (!b && V[t]) b = 'Variable. ' + V[t];
  return { h: t, b: b || 'Shell token, variable or command name.' };
}

function tk(line, note) {
  let h = '', p = 0;
  toks(line).forEach(o => {
    const e = ex(o, line);
    e.n = note || '';
    h += esc(line.slice(p, o.i)) + `<span class="tk" data-e="${EX.length}">${esc(o.t)}</span>`;
    EX.push(e);
    p = o.i + o.t.length;
  });
  return h + esc(line.slice(p));
}

function tp(e) {
  const t = e.target.closest && e.target.closest('.tk');
  const tip = $('tip');
  if (!t) { tip.style.display = 'none'; return; }
  const x = EX[+t.dataset.e];
  tip.innerHTML = `<strong>${esc(x.h)}</strong><br>${esc(x.b)}` + (x.n ? `<br><small style="color:#facc15">Line Logic: ${esc(x.n)}</small>` : '');
  tip.style.display = 'block';
  const r = t.getBoundingClientRect();
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + 'px';
  tip.style.top = (r.bottom + 8 + hh > window.innerHeight ? Math.max(8, r.top - hh - 8) : r.bottom + 8) + 'px';
}
document.addEventListener('mouseover', tp);
document.addEventListener('click', tp);

}

// Global Hotkeys Listener
window.addEventListener('keydown', e => {
  if (['input', 'textarea', 'select'].includes(document.activeElement?.tagName?.toLowerCase())) {
    if (e.key === 'Escape') document.activeElement.blur();
    return;
  }
  if (e.key === '[' || e.key === 'k') {
    if (cur > 0) show(cur - 1);
  } else if (e.key === ']' || e.key === 'j') {
    if (cur < D.length - 1) show(cur + 1);
  } else if (e.key === 'c') {
    const code = D[cur].code.join('\n');
    navigator.clipboard.writeText(code);
  } else if (e.key === 'd') {
    downloadCurrentScript();
  } else if (e.key === 'm') {
    toggleMastered(cur);
  } else if (e.key === 't') {
    toggleTheme();
  } else if (e.key === 'p') {
    switchTab('practice');
  } else if (e.key === '/') {
    e.preventDefault();
    $('sq')?.focus();
  } else if (e.key === '?') {
    openCheatModal();
  } else if (e.key === 'Escape') {
    closeModal();
  }
});

// Hash routing
function route() {
  const hash = window.location.hash;
  const num = parseInt(hash.replace(/[^0-9]/g, ''), 10);
  if (!isNaN(num) && num >= 1 && num <= D.length) {
    show(num - 1);
  } else {
    show(0);
  }
}
window.addEventListener('hashchange', route);

// Initialize
renderNav();
route();
updateProgressUI();
